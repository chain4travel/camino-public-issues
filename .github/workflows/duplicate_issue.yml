name: Duplicate Issue to Dev Dashboard

on:
  push:
    branches:
      - fix-issue

jobs:
  duplicate_issue:
    name: duplicate_issue
    runs-on: ubuntu-latest
    steps:
    - name: Prepare Title and Body
      id: issue-params
      run: |   
        echo "hiiii 0"
        cat > issue.md<<- 'EOM'
        ${{ github.event.issue.body }}

        ---

        This issue is related to public issue:
        * https://github.com/chain4travel/camino-public-issues/issues/${{ github.event.issue.number }}
        EOM
        echo "hiiii 1"
        ISSUE_BODY=$(cat issue.md)
        cat > title.md<<- 'EOM'
        ${{ github.event.issue.title }}
        EOM
        echo "hiiii 2"
        TITLE=$(cat title.md)
        echo "hiiii 3"
        BODY=${ISSUE_BODY//['"']/'\"'}
        echo "hiiii 4"
        {
        echo 'title<<EOM'
        $TITLE
        echo EOM
        } >> "$GITHUB_OUTPUT"
        echo "hiiii 5"
        {
        echo 'body<<EOM'
        $BODY
        echo EOM
        } >> "$GITHUB_OUTPUT"
        echo "hiiii 6"

    - name: Create Private Issue
      run: |        
        echo "${{ steps.issue-params.outputs.title }}"
        echo "${{ steps.issue-params.outputs.body }}"
